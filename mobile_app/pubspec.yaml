name: portfolify_mobile
description: "Cross-platform Flutter app for Portfolify - Dynamic Portfolio Generator & Builder"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.0
  flutter_animate: ^4.5.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
